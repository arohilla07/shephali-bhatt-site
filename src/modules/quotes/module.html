<section class="interlude m-quotes" aria-labelledby="m-quotes-title">
  <div class="wrap">
    <header class="inter-head reveal">
      <p class="label"><span class="label-dot" aria-hidden="true"></span>Pegboard</p>
      <h2 class="inter-title" id="m-quotes-title">&ldquo;I collect memories <em>in quotes.</em>&rdquo;</h2>
      <p class="inter-lede">The line above is hers, from Instagram. So is everything on this board, pinned up word for word.</p>
    </header>

    <ul class="m-quotes-board reveal" role="list">

      <li class="m-quotes-slot m-quotes-slot--clip">
        <div class="m-quotes-hang">
          <figure class="m-quotes-card m-quotes-card--white">
            <svg class="m-quotes-fix m-quotes-fix--clip" viewBox="0 0 48 46" width="48" height="46" aria-hidden="true" focusable="false">
              <path class="m-quotes-line" d="M17 25V12a7 7 0 0 1 14 0v13"/>
              <path class="m-quotes-line m-quotes-fill-blue" d="M9 24h30l3 18H6Z"/>
              <path class="m-quotes-line m-quotes-line--faint" d="M13 31h22"/>
            </svg>
            <blockquote class="m-quotes-text"><p>&ldquo;Like any good journalist, I&rsquo;m a chronicler of the first draft of history.&rdquo;</p></blockquote>
            <figcaption class="m-quotes-src">Interview, Thousand Faces Club, 2023</figcaption>
          </figure>
        </div>
        <span class="m-quotes-peg" aria-hidden="true"></span>
      </li>

      <li class="m-quotes-slot m-quotes-slot--s m-quotes-slot--tag m-quotes-slot--sway">
        <div class="m-quotes-hang">
          <figure class="m-quotes-card m-quotes-card--tag">
            <svg class="m-quotes-shape" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
              <path class="m-quotes-shape-shadow" d="M17 1H83L99 15V99H1V15Z"/>
              <path class="m-quotes-shape-paper" d="M17 1H83L99 15V99H1V15Z" vector-effect="non-scaling-stroke"/>
            </svg>
            <svg class="m-quotes-fix m-quotes-fix--string" viewBox="0 0 40 54" width="40" height="54" aria-hidden="true" focusable="false">
              <circle class="m-quotes-fill-birch" cx="20" cy="46" r="7.5"/>
              <circle class="m-quotes-line m-quotes-fill-white" cx="20" cy="46" r="3.4"/>
              <path class="m-quotes-line m-quotes-line--thin" d="M20 46C10 35 12 14 20 5c8 9 10 30 0 41"/>
            </svg>
            <blockquote class="m-quotes-text m-quotes-text--big"><p>&ldquo;I travel light.&rdquo;</p></blockquote>
            <figcaption class="m-quotes-src">Instagram</figcaption>
          </figure>
        </div>
        <span class="m-quotes-peg" aria-hidden="true"></span>
      </li>

      <li class="m-quotes-slot m-quotes-slot--pin">
        <div class="m-quotes-hang">
          <figure class="m-quotes-card m-quotes-card--blue">
            <blockquote class="m-quotes-text"><p>&ldquo;I don&rsquo;t enjoy being on the internet. I proactively spend more time offline than online.&rdquo;</p></blockquote>
            <figcaption class="m-quotes-src">Interview, Thousand Faces Club, 2023</figcaption>
          </figure>
        </div>
        <span class="m-quotes-peg" aria-hidden="true"></span>
      </li>

      <li class="m-quotes-slot m-quotes-slot--s m-quotes-slot--pin">
        <div class="m-quotes-hang">
          <figure class="m-quotes-card m-quotes-card--yellow">
            <blockquote class="m-quotes-text"><p>&ldquo;Apps have all the data but no context.&rdquo;</p></blockquote>
            <figcaption class="m-quotes-src">Instagram, on Year Wrapped</figcaption>
          </figure>
        </div>
        <span class="m-quotes-peg" aria-hidden="true"></span>
      </li>

      <li class="m-quotes-slot m-quotes-slot--s m-quotes-slot--hanger m-quotes-slot--sway">
        <div class="m-quotes-hang">
          <figure class="m-quotes-card m-quotes-card--white">
            <svg class="m-quotes-fix m-quotes-fix--hanger" viewBox="0 0 124 66" width="124" height="66" aria-hidden="true" focusable="false">
              <path class="m-quotes-line" d="M62 31v-5c0-5 7-5 7-12a7 7 0 1 0-14 0"/>
              <path class="m-quotes-line" d="M62 31l50 20a3 3 0 0 1-1.1 5.8H13.1A3 3 0 0 1 12 51Z"/>
              <rect class="m-quotes-line m-quotes-fill-yellow" x="31" y="50" width="7" height="14" rx="2"/>
              <rect class="m-quotes-line m-quotes-fill-yellow" x="86" y="50" width="7" height="14" rx="2"/>
            </svg>
            <blockquote class="m-quotes-text m-quotes-text--big"><p>&ldquo;No new hangers.&rdquo;</p></blockquote>
            <figcaption class="m-quotes-src">Instagram</figcaption>
          </figure>
        </div>
        <span class="m-quotes-peg" aria-hidden="true"></span>
      </li>

      <li class="m-quotes-slot m-quotes-slot--pin">
        <div class="m-quotes-hang">
          <figure class="m-quotes-card m-quotes-card--white m-quotes-card--ruled">
            <blockquote class="m-quotes-text"><p>&ldquo;I smile easily. Just as easily as I cry. Probably in equal measure. Accountancy grad here, I&rsquo;m all about the balance.&rdquo;</p></blockquote>
            <figcaption class="m-quotes-src">Instagram</figcaption>
          </figure>
        </div>
        <span class="m-quotes-peg" aria-hidden="true"></span>
      </li>

      <li class="m-quotes-slot m-quotes-slot--tape">
        <div class="m-quotes-hang">
          <figure class="m-quotes-card m-quotes-card--rose">
            <span class="m-quotes-tape m-quotes-tape--blue" aria-hidden="true"></span>
            <blockquote class="m-quotes-text"><p>&ldquo;Calling &lsquo;dropping someone off at the airport&rsquo; a love language is a cop-out.&rdquo;</p></blockquote>
            <figcaption class="m-quotes-src">Instagram</figcaption>
          </figure>
        </div>
      </li>

      <li class="m-quotes-slot m-quotes-slot--pin">
        <div class="m-quotes-hang">
          <figure class="m-quotes-card m-quotes-card--green">
            <blockquote class="m-quotes-text"><p>&ldquo;Language is something I&rsquo;ve always been fascinated by, and memory is something I&rsquo;m currently obsessed with.&rdquo;</p></blockquote>
            <figcaption class="m-quotes-src">Instagram</figcaption>
          </figure>
        </div>
        <span class="m-quotes-peg" aria-hidden="true"></span>
      </li>

      <li class="m-quotes-slot m-quotes-slot--tape">
        <div class="m-quotes-hang">
          <figure class="m-quotes-card m-quotes-card--white">
            <span class="m-quotes-tape m-quotes-tape--yellow" aria-hidden="true"></span>
            <blockquote class="m-quotes-text"><p>&ldquo;I believe you always do a great job of a story you really care about.&rdquo;</p></blockquote>
            <figcaption class="m-quotes-src">Muck Rack profile</figcaption>
          </figure>
        </div>
      </li>

    </ul>

    <div class="m-quotes-foot reveal">
      <p class="inter-note m-quotes-note">
        <span class="m-quotes-note-wide">Parts list: 9 cards, 1 pegboard. Hover or tap a card to straighten it.</span>
        <span class="m-quotes-note-narrow">9 cards, 1 pegboard. Swipe along the board<span class="m-quotes-note-live">, tap a card to straighten it</span>.</span>
      </p>
      <button type="button" class="btn btn-quiet m-quotes-shuffle" hidden>
        <svg class="m-quotes-shuffle-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M2 6h3c2.2 0 3.3 1 4.3 2.7l1.4 2.6c1 1.7 2.1 2.7 4.3 2.7h3M15.5 3.5 18 6l-2.5 2.5M15.5 11.5 18 14l-2.5 2.5M2 14h3c1.3 0 2.2-.4 3-1.2M18 6h-3c-1.3 0-2.2.4-3 1.2"/>
        </svg>
        Shuffle the board
      </button>
      <p class="sr-only m-quotes-status" aria-live="polite"></p>
    </div>
  </div>
</section>
